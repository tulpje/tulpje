[workspace]
members = ["crates/*"]

resolver = "3"

[profile.dev]
debug = "line-tables-only"

[workspace.package]
version = "0.26.1-rc.4"
description = "Multi-purpose discord bot & framework"
homepage = "https://github.com/tulpje/tulpje"
repository = "https://github.com/tulpje/tulpje"
license = "CC-BY-NC-SA-4.0"
# See also `rust-toolchain.toml`
rust-version = "1.94.0"
edition = "2024"

[workspace.metadata]
crane.name = "tulpje"

[workspace.dependencies]
async-trait = { version = "0.1.89" }
chrono = { version = "0.4.42", features = ["alloc", "clock", "std"], default-features = false }
metrics = { version = "0.24.3" }
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }
pluralkit-rs = { version = "0.1.0", git = "https://github.com/tulpje/pluralkit-rs.git", rev = "8250e015370cfbae376debe368b77f7e6e98e611", features = ["sqlx", "metrics"] }
redis = { version = "1.0.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.1", default-features = false }
rustls = { version = "0.23.35", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "uuid"] }
thiserror = { version = "2.0.18" }
tokio = { version = "1.48.0" }
tokio-util = { version = "0.7.17" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
twilight-cache-inmemory = { version = "0.17.1" }
twilight-gateway = { version = "0.17.1", default-features = false }
twilight-http = { version = "0.17.1", default-features = false }
twilight-model = { version = "0.17.1" }
twilight-util = { version = "0.17.0" }
uuid = { version = "1.19.0", features = ["v7", "serde"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# anti-panic
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# give a reason why it's allowed, thanks
allow_attributes = "deny"
# using `mod.rs` files gives more clean source layouts so we prefer that
self_named_module_files = "deny"
# we like consistency :)
renamed_function_params = "warn"
# rust can't always optimise them out so remove them
redundant_clone = "warn"
# for loops are clearer if we can use them
needless_for_each = "warn"
# clearer we're doing a "cheap" clone this way
clone_on_ref_ptr = "warn"
# it's probably mistake unless explicitly allowed
integer_division = "warn"
# we should explicitly ok data loss when converting types
cast_lossless = "warn"
cast_precision_loss = "warn"
# I do like this syntax, but it might be less clear
if_then_some_else_none = "warn"
# the suggestions are usually not great, but this does usually indicate we can
# refactor the code to
option_if_let_else = "warn"
# don't wanna evaluate things unnecessarily
or_fun_call = "warn"
# .iter() / .into_iter() are not needed when using for loops
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"

manual_assert = "warn"
redundant_else = "warn"
unwrap_in_result = "warn"
unneeded_field_pattern = "warn"
ignored_unit_patterns = "warn"
semicolon_if_nothing_returned = "warn"
unused_trait_names = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
from_iter_instead_of_collect = "warn"
needless_pass_by_value = "warn"
use_self = "warn"
get_unwrap = "warn"
partial_pub_fields = "warn"
missing_assert_message = "warn"
match_bool = "deny"
redundant_closure = "warn"

# maybe enable in the future
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
redundant_pub_crate = "allow"
missing_const_for_fn = "allow"
